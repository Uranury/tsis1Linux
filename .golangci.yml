# golangci-lint v2 configuration.
# Install:  go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
# Run:      golangci-lint run ./...
# Fix:      golangci-lint run --fix ./...
version: "2"

linters:
  # Defaults already enabled: errcheck, govet, ineffassign, staticcheck, unused.
  enable:
    - bodyclose   # unclosed HTTP response bodies (matters once the REST handlers land)
    - errorlint   # use errors.Is/As instead of == and %v for wrapped errors
    - misspell
    - unconvert   # redundant type conversions

formatters:
  enable:
    - gofmt
    - goimports
